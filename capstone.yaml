version: "1.0"
name: "flyrank-capstone-widget-platform"
language: "python"
framework: "fastapi"
run: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python -m app.seed"
test: "pytest"
base_url: "http://localhost:8000"
endpoints:
  health: "GET /health"
  config: "GET /api/widgets/{widget_id}/config"
  submit: "POST /api/submissions"
  dashboard: "GET /api/dashboard/stats"